name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/adoc-builder

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image (from compose)
        run: |
          docker build -t adoc-asciidoctor:latest -f .devcontainer/app/asciidoctor.Dockerfile .

          IMAGE_ID=$(docker image ls -q adoc-asciidoctor:latest)
          if [ -z "$IMAGE_ID" ]; then
            echo "Failed to resolve built image for asciidoctor service"
            exit 1
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Tagging and pushing: $tag"
            docker tag "$IMAGE_ID" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
