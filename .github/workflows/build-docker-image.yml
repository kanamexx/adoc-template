name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/adoc-builder

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker images
        run: |
          # Build asciidoctor image
          docker build -t adoc-asciidoctor:latest -f .devcontainer/app/asciidoctor.Dockerfile .
          IMAGE_ID=$(docker image ls -q adoc-asciidoctor:latest)
          if [ -z "$IMAGE_ID" ]; then
            echo "Failed to resolve built image for asciidoctor service"
            exit 1
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Tagging and pushing asciidoctor: $tag"
            docker tag "$IMAGE_ID" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          # Build app image
          docker build -t docker.io/library/asciidoc-template-app:latest -f .devcontainer/app/Dockerfile .
          APP_IMAGE_ID=$(docker image ls -q docker.io/library/asciidoc-template-app:latest)
          if [ -z "$APP_IMAGE_ID" ]; then
            echo "Failed to resolve built image for app service"
            exit 1
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            APP_TAG="${tag%/adoc-builder}/app"
            echo "Tagging and pushing app: $APP_TAG"
            docker tag "$APP_IMAGE_ID" "$APP_TAG"
            docker push "$APP_TAG"
          done <<< "${{ steps.meta.outputs.tags }}"
